[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loadsim"
version = "0.1.0"
description = "Simple traffic probes for deployed systems"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["loadsim*"]
