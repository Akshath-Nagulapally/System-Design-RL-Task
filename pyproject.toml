[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "loadsim"
version = "0.1.0"
description = "Simple traffic probes for deployed systems"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["loadsim", "task_runner", "deployment_server"]
