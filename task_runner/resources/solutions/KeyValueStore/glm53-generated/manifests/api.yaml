apiVersion: apps/v1
kind: Deployment
metadata:
  name: kv-api
  namespace: kv
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: kv-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kv-api
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: kv-api
              topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: kv-api:local
          imagePullPolicy: IfNotPresent
          env:
            - name: ETCD_ENDPOINTS
              value: http://etcd-0.etcd-headless.kv.svc:2379,http://etcd-1.etcd-headless.kv.svc:2379,http://etcd-2.etcd-headless.kv.svc:2379
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kv-api
  namespace: kv
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kv-api
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kv-api
  namespace: kv
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kv-api
